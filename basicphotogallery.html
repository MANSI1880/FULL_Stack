<!DOCTYPE html>
<html>
<head>
    <title>Photo Gallery</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: white;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(4, 150px);
            gap: 8px;
        }

        .box {
            width: 150px;
            height: 150px;
            position: relative;
            overflow: hidden;
            background-color: rgb(241, 171, 241);
        }

        .box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .number {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 30px;
            font-weight: bold;
            color: white;
        }
    </style>
</head>

<body>

    <div class="gallery">

        <div class="box">
            <img src="photo1.jpg">
            <div class="number">1</div>
        </div>

        <div class="box">
            <img src="photo2.jpg">
            <div class="number">2</div>
        </div>

        <div class="box">
            <img src="photo3.jpg">
            <div class="number">3</div>
        </div>

        <div class="box">
            <img src="photo4.jpg">
            <div class="number">4</div>
        </div>

        <div class="box">
            <img src="photo5.jpg">
            <div class="number">5</div>
        </div>

        <div class="box">
            <img src="photo6.jpg">
            <div class="number">6</div>
        </div>

        <div class="box">
            <img src="photo7.jpg">
            <div class="number">7</div>
        </div>

        <div class="box">
            <img src="photo8.jpg">
            <div class="number">8</div>
        </div>

        <div class="box">
            <img src="photo9.jpg">
            <div class="number">9</div>
        </div>

        <div class="box">
            <img src="photo10.jpg">
            <div class="number">10</div>
        </div>

        <div class="box">
            <img src="photo11.jpg">
            <div class="number">11</div>
        </div>

        <div class="box">
            <img src="photo12.jpg">
            <div class="number">12</div>
        </div>

    </div>

</body>
</html>
