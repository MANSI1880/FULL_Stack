<!DOCTYPE html>
<html>
<head>
    <title>Three Grey Boxes</title>

    <style>
        .container {
            display: flex;
            gap: 30px;
            justify-content: center;
            margin-top: 200px;
        }

        .box {
            width: 200px;
            height: 200px;
            background-color: grey;
            border: 3px solid transparent;
        }

        .box:hover {
            border: 3px solid red;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>

</body>
</html>
