<!DOCTYPE html>
<html>
<head>
    <title>Bento Design</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: white;
        }

        .bento {
            width: 500px;
            height: 400px;
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
            gap: 8px;
        }

        .box {
            background-color: rgb(241, 171, 241);
            border-radius: 10px;
        }

        .main {
            grid-column: 1 / 3;
            grid-row: 1 / 3;
        }

        .box1 {
            grid-column: 3;
            grid-row: 1;
        }

        .box2 {
            grid-column: 3;
            grid-row: 2;
        }

        .box3 {
            grid-column: 1;
            grid-row: 3;
        }

        .box4 {
            grid-column: 2;
            grid-row: 3;
        }

        .box5 {
            grid-column: 3;
            grid-row: 3;
        }
    </style>
</head>

<body>

    <div class="bento">

        <div class="box main"></div>

        <div class="box box1"></div>
        <div class="box box2"></div>
        <div class="box box3"></div>
        <div class="box box4"></div>
        <div class="box box5"></div>

    </div>

</body>
</html>
