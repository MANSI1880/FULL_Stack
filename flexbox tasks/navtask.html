<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Navigation Bar</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            padding: 20px;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        .navbar{
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: navy;
            border-radius: 5px;
            padding: 15px 25px;
        }

        .logo{
            flex: 1;
            color: white;
            font-size: 22px;
            font-weight: bold;
        }

        .nav-links{
            flex: 1;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
        }

        .nav-links a{
            color: white;
            text-decoration: none;
            font-size: 18px;
        }

        .nav-links a:hover{
            color: lightgray;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo">
            Logo
        </div>

        <div class="nav-links">
            <a href="#">Nav1</a>
            <a href="#">Nav2</a>
            <a href="#">Nav3</a>
            <a href="#">Nav4</a>
        </div>
    </nav>

</body>
</html>
